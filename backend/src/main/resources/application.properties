spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:evre}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Spring Mail Configuration =====
# Gelistirme ortami icin Mailtrap kullanilabilir (https://mailtrap.io)
# Uretim ortaminda bu degerleri cevre degiskeniyle gecersiz kilin
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:your_mailtrap_username}
spring.mail.password=${MAIL_PASSWORD:your_mailtrap_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Gonderen adresi
app.mail.from=${MAIL_FROM:noreply@evre.app}
